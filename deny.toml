# cargo-deny configuration. Run with `just deny-rust` (cargo deny check).

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    # OpenSSL is vendored + statically linked by git2 (vendored-openssl) so the
    # aarch64-linux cross build needs no sysroot OpenSSL.
    "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
# ring ships a bespoke permissive licence bundle; it is a transitive rustls dep.
allow = ["OpenSSL", "ISC", "MIT"]
name = "ring"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
